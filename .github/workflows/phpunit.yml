---
name: PHPUnit

on:
  - workflow_call
  - pull_request
  - push

jobs:
  phpunit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - lowest
          - highest

    name: ${{ matrix.os }}:PHP-${{ matrix.php-version }}:${{ matrix.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - run: composer --version

      - if: matrix.dependencies == 'highest'
        run: composer install --no-interaction --no-progress --ansi

      - if: matrix.dependencies == 'lowest'
        run: composer install --no-interaction --no-progress --ansi --prefer-lowest

      - run: composer bin phpunit install --no-interaction --no-progress --ansi

      - if: ${{ github.event_name == 'workflow_call' }}
        name: Run PHPUnit
        run: vendor/bin/phptailors-workflows run:phpunit

      - if: ${{ github.event_name != 'workflow_call' }}
        name: Run PHPUnit
        run: php bin/phptailors-workflows run:phpunit
